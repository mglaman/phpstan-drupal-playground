service: phpstan-drupal-runner

provider:
  name: aws
  region: us-east-1
  architecture: arm64
  stage: prod
  versionFunctions: false
  httpApi:
    cors: true

plugins:
    - ./vendor/bref/bref

package:
  patterns:
    - '!node_modules/**'
    - '!tests/**'
    - '!phpunit.xml'

functions:
  analyze:
    handler: analyze.php
    description: ''
    timeout: 28
    runtime: php-84
