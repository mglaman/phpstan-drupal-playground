name: "Deploy Website"
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-website.yml'
      - 'website/**'
concurrency: app_build
jobs:
  build:
    name: "Build & deploy"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install Node"
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: "npm install"
        working-directory: ./website
        run: "npm install"
      - name: "Test"
        working-directory: ./website
        run: "npm test"
      - name: "npm build"
        working-directory: ./website
        run: "npm run build"
      - name: "configure AWS"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Deploy
        working-directory: ./website
        run: |
          # Only hashed assets may be cached immutably. index.html and
          # llms.txt keep their names between deploys, so a long cache would
          # pin browsers and agents to a stale copy.
          aws s3 sync ./dist s3://phpstan-drupal-web --exclude "index.html" --exclude "llms.txt" --cache-control "public,max-age=31536000,immutable"
          aws s3 cp ./dist/index.html s3://phpstan-drupal-web/index.html --cache-control "no-cache"
          aws s3 cp ./dist/llms.txt s3://phpstan-drupal-web/llms.txt --cache-control "no-cache" --content-type "text/plain; charset=utf-8"
      - name: Invalidate CloudFront
        working-directory: ./website
        run: aws cloudfront create-invalidation --distribution-id EJLWUQZMNXH6E --paths "/*"
