version: 2
updates:
  # Runner composer deps are intentionally absent: the update-runner-deps
  # workflow updates, tests, and deploys them automatically each month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/playground-runner"
    schedule:
      interval: "monthly"
    groups:
      runner-tooling:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/playground-api"
    schedule:
      interval: "monthly"
    groups:
      api-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    groups:
      website-dependencies:
        patterns:
          - "*"
